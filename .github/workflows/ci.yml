name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test -- --run
      - run: pnpm build
      - name: Playground validator (PRs only)
        if: github.event_name == 'pull_request'
        run: |
          # Every PR must keep the agent-editable surface within the rules. Non-playground PRs
          # (touching core/backend) are gated by CODEOWNERS review instead, so only run when the
          # diff touches src/rooms.
          if git diff --name-only ${{ github.event.pull_request.base.sha }}...HEAD | grep -q '^src/rooms/'; then
            node scripts/validate-playground.mjs --base ${{ github.event.pull_request.base.sha }} --scope large
          else
            echo "no room changes"
          fi
      - name: Playground PRs may only touch the wall
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'playground')
        run: |
          bad=$(git diff --name-only ${{ github.event.pull_request.base.sha }}...HEAD | grep -v '^src/rooms/' || true)
          if [ -n "$bad" ]; then echo "playground PR touches protected paths:"; echo "$bad"; exit 1; fi
  playtest:
    # Every changed block is mounted alone, poked, and looked at. A block that renders but doesn't work
    # (a dino that can't jump) fails here, not on the wall.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Which blocks changed
        id: blocks
        run: |
          ids=$(git diff --name-only ${{ github.event.pull_request.base.sha }}...HEAD | grep -E '^src/rooms/main/blocks/.*\.tsx$' | xargs -n1 basename 2>/dev/null | sed 's/\.tsx$//' | paste -sd, -)
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
          echo "changed blocks: ${ids:-none}"
      - if: steps.blocks.outputs.ids != ''
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.blocks.outputs.ids != ''
        run: pnpm build
      - if: steps.blocks.outputs.ids != ''
        name: Playtest the changed blocks
        env:
          BLOCKS: ${{ steps.blocks.outputs.ids }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          (pnpm exec vite preview --host 127.0.0.1 --port 4173 --strictPort >/tmp/preview.log 2>&1 &)
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:4173/ && break; sleep 1; done
          # pipefail: the job must fail when the tests do (tee's exit code hid every failure until 2026-09-05)
          set -o pipefail
          pnpm exec playwright test --config playwright.blocks.config.ts 2>&1 | tee /tmp/playtest.log
      - if: failure() && steps.blocks.outputs.ids != ''
        name: Tell the PR what the playtester saw
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body=$(grep -E "playtest .*works=|playtester:|Error:|expect\(" /tmp/playtest.log | head -20 | sed 's/^/    /')
          gh pr comment ${{ github.event.pull_request.number }} --body "**Playtest failed.** The block was mounted alone, played, and looked at:"$'\n\n'"$body"$'\n\n'"The change won't merge until this passes."

