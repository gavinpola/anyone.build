name: timelapse
# The wall, change by change: a screenshot of the live site after every production deploy (that is when
# a change lands; the script posts only if the changes count grew), a heartbeat every six hours from the
# schedule, and a forced frame on workflow_dispatch. Frames live 30 days and play on /timelapse.
on:
  deployment_status:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: timelapse
  cancel-in-progress: false
jobs:
  frame:
    if: github.event_name != 'deployment_status' || (github.event.deployment_status.state == 'success' && contains(github.event.deployment.environment, 'roduction'))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Let the deploy settle at the edge
        if: github.event_name == 'deployment_status'
        run: sleep 90
      - name: Screenshot the wall and post the frame
        env:
          SITE_URL: https://everyones.lol
          CONVEX_SITE_URL: https://hushed-ladybug-141.convex.site
          CONVEX_URL: https://hushed-ladybug-141.convex.cloud
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          TIMELAPSE_TOKEN: ${{ secrets.TIMELAPSE_TOKEN }}
        run: node scripts/timelapse.mjs
