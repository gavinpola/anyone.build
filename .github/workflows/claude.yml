name: claude
# The coding agent for the site itself. A feedback note a maintainer approves becomes an issue here
# that mentions @claude; this workflow picks it up and opens a pull request for a maintainer to merge.
# Also answers @claude on any issue or PR comment. Needs the ANTHROPIC_API_KEY secret.
on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: |
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # the site's chrome lives outside src/rooms; the wall's own pipeline owns that folder
          claude_args: |
            --allowedTools "Bash(pnpm install),Bash(pnpm typecheck),Bash(pnpm lint),Bash(pnpm test),Bash(pnpm build)"
