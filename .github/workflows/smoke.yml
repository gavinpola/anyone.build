name: smoke
# Runs the browser smoke test against every successful Vercel preview deployment.
on:
  deployment_status:
permissions:
  contents: read
  statuses: write
jobs:
  smoke:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Preview'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm smoke
        env:
          SMOKE_URL: ${{ github.event.deployment_status.environment_url }}
      - name: Report status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo,
              sha: context.payload.deployment.sha,
              state: '${{ job.status }}' === 'success' ? 'success' : 'failure',
              context: 'smoke', description: 'wall renders on the preview',
            });
