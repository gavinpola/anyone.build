<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- e.l — everyones.lol. Geometry, not text: a ring with a bar for the e, the orange dot on the baseline, a stem for the l. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262219"/>
      <stop offset="1" stop-color="#14120e"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#g)"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" fill="none" stroke="#f3efe6" stroke-opacity="0.08"/>
  <g fill="none" stroke="#f3efe6" stroke-width="5.5" stroke-linecap="round">
    <!-- e: the bar through the middle, then the ring from the bar's right end up over the top and round to four o'clock -->
    <path d="M9 40 H27 A9 9 0 1 0 24.9 45.8"/>
    <!-- l: the stem -->
    <path d="M44 14 V50"/>
  </g>
  <!-- the dot -->
  <circle cx="35" cy="47.5" r="3.4" fill="#ff5a1f"/>
</svg>
